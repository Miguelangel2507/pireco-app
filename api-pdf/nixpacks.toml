# Railway usa nixpacks para construir el entorno.
# WeasyPrint necesita estas librerías del sistema.

[phases.setup]
nixPkgs = [
  "python311",
  "pango",
  "cairo",
  "gdk-pixbuf",
  "libffi",
  "fontconfig",
  "freetype",
  "harfbuzz",
]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"
